---
# ═══════════════════════════════════════════════════════════════════════════════
# IDLE RETURN TO HOME PAGE
# ═══════════════════════════════════════════════════════════════════════════════
# Automatically navigates back to main_page after the display has gone
# unused (no touch input) for a configurable timeout while some other page
# (a detail page, a sub-screen, ...) is showing.
#
# Reads LVGL's own built-in inactivity timer (the same one that drives the
# backlight idle timeout in backlight_time.yaml) instead of hooking touch
# events itself, so it needs no changes to any hardware file, page, or
# button — just include this file.
#
# Optional substitution (default provided below, override in your device
# YAML to change it):
#   idle_home_timeout_minutes: "5"   # Minutes of inactivity before returning home (0 disables)
# ═══════════════════════════════════════════════════════════════════════════════

substitutions:
  idle_home_timeout_minutes: "5"

interval:
- interval: 15s
  then:
  - if:
      condition:
        lambda: |-
          float timeout_min = ${idle_home_timeout_minutes};
          if (timeout_min <= 0) return false;
          uint32_t idle_ms = lv_disp_get_inactive_time(nullptr);
          return idle_ms >= (uint32_t)(timeout_min * 60000.0f) && lv_scr_act() != id(main_page);
      then:
      - lvgl.page.show:
          id: main_page
          animation: MOVE_RIGHT
          time: 300ms

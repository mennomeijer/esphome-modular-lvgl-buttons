---
# ═══════════════════════════════════════════════════════════════════════════════
# IDLE RETURN TO HOME PAGE
# ═══════════════════════════════════════════════════════════════════════════════
# Navigates back to main_page once after the display has gone unused (no
# touch input) for a configurable timeout, then re-arms as soon as the
# screen is touched again.
#
# This deliberately does NOT try to detect "is main_page currently active" —
# two attempts at that both hit dead ends: ESPHome wraps LVGL pages in an
# internal type that isn't directly comparable to a raw lv_obj_t* (so
# lv_scr_act() can't be compared to id(main_page) without a cast into
# internals this library shouldn't depend on), and adding an identifying
# marker widget to main_page requires a free grid cell — which doesn't
# exist on a fully-tiled page (e.g. a 3x2 grid with 6 tiles already fills
# every cell).
#
# Instead, it just fires lvgl.page.show once per idle period (a "triggered"
# flag re-arms on the next touch), regardless of which page is currently
# showing. In the rare case the screen is already sitting on main_page when
# the timeout hits, this replays one harmless same-page transition.
#
# Optional substitution (default provided below, override in your device
# YAML to change it):
#   idle_home_timeout_minutes: "5"   # Minutes of inactivity before returning home (0 disables)
# ═══════════════════════════════════════════════════════════════════════════════

substitutions:
  idle_home_timeout_minutes: "5"

globals:
- id: idle_home_triggered
  type: bool
  initial_value: 'false'

interval:
- interval: 15s
  then:
  - if:
      condition:
        lambda: |-
          float timeout_min = ${idle_home_timeout_minutes};
          if (timeout_min <= 0) return false;
          uint32_t idle_ms = lv_disp_get_inactive_time(nullptr);
          bool past_timeout = idle_ms >= (uint32_t)(timeout_min * 60000.0f);
          if (!past_timeout) {
            id(idle_home_triggered) = false;
            return false;
          }
          if (id(idle_home_triggered)) return false;
          id(idle_home_triggered) = true;
          return true;
      then:
      - lvgl.page.show:
          id: main_page
          animation: MOVE_RIGHT
          time: 300ms

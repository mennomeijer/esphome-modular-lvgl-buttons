---
# Media button detail page — quick-actions panel with a scene shortcut and
# volume up/down controls for a Home Assistant media_player.
# Included automatically by remote.yaml via packages:. Never include directly.
#
# Both actions are inherently Home Assistant only (scenes and media_players
# are HA concepts), so — like the light detail page's scene shortcuts — this
# page calls homeassistant.action directly instead of going through an
# abstract local/remote script contract.
#
# vars (passed through by remote.yaml):
#   uid, text, page_id
#   scene_entity_id, scene_text, scene_icon
#   media_player_entity_id
#   zone2_entity_id, zone2_text, zone2_icon — optional "Off" button, hidden
#   unless zone2_entity_id is set. Stops playback then powers off zone 2.
#   stop_entity_id — optional additional HA media_player entity to stop
#   (media_player.media_stop) when the zone2 off button is pressed, e.g. a
#   separate streaming source (Music Assistant, ...) feeding the same zone
#   scene_2_entity_id, scene_2_text, scene_2_icon — optional second scene
#   shortcut, hidden unless scene_2_entity_id is set
#   input_entity_id, input_source, input_icon — optional small icon-only
#   button between the volume buttons, hidden unless input_entity_id is
#   set. Turns that media_player on (harmless no-op if already on) then
#   calls media_player.select_source with input_source

lvgl:
  pages:
  - id: ${uid}_detail_page
    styles: page_style
    scrollable: false
    scrollbar_mode: "OFF"
    widgets:

    # ── HEADER ────────────────────────────────────────────────────────────
    - button:
        id: ${uid}_back_btn
        align: TOP_LEFT
        x: 10
        y: 10
        width: 60
        height: 60
        bg_opa: transp
        border_width: 0
        shadow_width: 0
        radius: 30
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $label_on_color
            text: $mdi_chevron_left
        on_click:
        - lvgl.page.show:
            id: ${page_id | default("main_page")}
            animation: MOVE_RIGHT
            time: 300ms

    - label:
        align: TOP_MID
        y: 22
        text_font: nunito_24
        text_color: $label_on_color
        text: ${text}

    # ── SCENE SHORTCUT ───────────────────────────────────────────────────
    # Four action rows, top to bottom: scene, scene 2, zone 2, volume.
    # Fixed y offsets -100/-10/80/170, height 65 each — row 4 spans
    # y≈378-443px (absolute), comfortably inside a 480px-tall screen below
    # the ~90px header.
    - button:
        id: ${uid}_scene_btn
        align: CENTER
        y: -100
        width: 75%
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene_entity_id}
        widgets:
        - label:
            align: LEFT_MID
            x: 20
            text_font: $icon_font
            text_color: $icon_off_color
            text: ${scene_icon}
        - label:
            align: CENTER
            text_font: nunito_24
            text_color: $label_on_color
            text: ${scene_text}

    # ── SCENE 2 SHORTCUT ─────────────────────────────────────────────────
    # Hidden unless scene_2_entity_id is configured
    - button:
        id: ${uid}_scene_2_btn
        align: CENTER
        y: -10
        width: 75%
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        hidden: ${"false" if scene_2_entity_id | default("") != "" else "true"}
        on_click:
        - homeassistant.action:
            action: scene.turn_on
            data:
              entity_id: ${scene_2_entity_id | default("")}
        widgets:
        - label:
            align: LEFT_MID
            x: 20
            text_font: $icon_font
            text_color: $icon_off_color
            text: ${scene_2_icon | default("")}
        - label:
            align: CENTER
            text_font: nunito_24
            text_color: $label_on_color
            text: ${scene_2_text | default("")}

    # ── ZONE 2 OFF ───────────────────────────────────────────────────────
    # Hidden unless zone2_entity_id is configured. Stops stop_entity_id (if
    # configured) — e.g. a separate streaming source feeding the same zone —
    # then stops current playback and powers the zone off.
    - button:
        id: ${uid}_zone2_off_btn
        align: CENTER
        y: 80
        width: 75%
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        hidden: ${"false" if zone2_entity_id | default("") != "" else "true"}
        on_click:
        - if:
            condition:
              lambda: return strcmp("${stop_entity_id | default('')}", "") != 0;
            then:
            - homeassistant.action:
                action: media_player.media_stop
                data:
                  entity_id: ${stop_entity_id | default("")}
        - homeassistant.action:
            action: media_player.media_stop
            data:
              entity_id: ${zone2_entity_id | default("")}
        - homeassistant.action:
            action: media_player.turn_off
            data:
              entity_id: ${zone2_entity_id | default("")}
        widgets:
        - label:
            align: LEFT_MID
            x: 20
            text_font: $icon_font
            text_color: $icon_off_color
            text: ${zone2_icon | default("")}
        - label:
            align: CENTER
            text_font: nunito_24
            text_color: $label_on_color
            text: ${zone2_text | default("")}

    # ── VOLUME DOWN ──────────────────────────────────────────────────────
    - button:
        id: ${uid}_volume_down_btn
        align: CENTER
        x: -25%
        y: 170
        width: 32%
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        on_click:
        - homeassistant.action:
            action: media_player.volume_down
            data:
              entity_id: ${media_player_entity_id}
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: $mdi_volume_minus

    # ── INPUT SELECT ─────────────────────────────────────────────────────
    # Small icon-only button between the volume buttons. Hidden unless
    # input_entity_id is configured. Turns that media_player on (harmless
    # no-op if it's already on) then selects input_source on it.
    - button:
        id: ${uid}_input_btn
        align: CENTER
        x: 0
        y: 170
        width: 60
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        hidden: ${"false" if input_entity_id | default("") != "" else "true"}
        on_click:
        - homeassistant.action:
            action: media_player.turn_on
            data:
              entity_id: ${input_entity_id | default("")}
        - homeassistant.action:
            action: media_player.select_source
            data:
              entity_id: ${input_entity_id | default("")}
              source: ${input_source | default("")}
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: ${input_icon | default("$mdi_speaker")}

    # ── VOLUME UP ────────────────────────────────────────────────────────
    - button:
        id: ${uid}_volume_up_btn
        align: CENTER
        x: 25%
        y: 170
        width: 32%
        height: 65
        radius: 16
        bg_color: $button_off_color
        border_width: 0
        on_click:
        - homeassistant.action:
            action: media_player.volume_up
            data:
              entity_id: ${media_player_entity_id}
        widgets:
        - label:
            align: CENTER
            text_font: $icon_font
            text_color: $icon_off_color
            text: $mdi_volume_plus
